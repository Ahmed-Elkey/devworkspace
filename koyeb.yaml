name: DevWorkspace API
services:
  - name: api
    dockerfile: backend/Dockerfile
    port: 3001
    env:
      # Set these in the Koyeb dashboard / CLI instead of in this file.
      # Rotate any previously exposed credentials before entering them.
      - key: DATABASE_URL
        value: "postgres://SET_IN_KOYEB_DASHBOARD"
      - key: REDIS_URL
        value: "rediss://SET_IN_KOYEB_DASHBOARD"
      - key: SMTP_URL
        value: "smtp://SET_IN_KOYEB_DASHBOARD:SET_IN_KOYEB_DASHBOARD@smtp.gmail.com:587"
      - key: SMTP_FROM
        value: "DevWorkspace <SET_IN_KOYEB_DASHBOARD>"
      - key: APP_ORIGIN
        value: "https://SET-AFTER-FRONTEND-DEPLOY.vercel.app"
    github:
      repo: Ahmed-Elkey/devworkspace
      branch: main
