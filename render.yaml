services:
  # Secrets (REDIS_URL, SMTP_URL, SMTP_FROM, BETTER_AUTH_SECRET) are marked
  # `sync: false`: Render prompts for their values in the Blueprint review, and
  # they are never written into this repository. Rotate any previously exposed
  # credentials BEFORE entering them here.
  - type: web
    name: devworkspace-api
    runtime: node
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pnpm install && pnpm build
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: devworkspace-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: SMTP_URL
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: APP_ORIGIN
        sync: false
      # Render routes to the process bound on $PORT; the API reads API_PORT.
      - key: API_PORT
        value: 10000
      # Render's proxy cannot reach a loopback-only listener.
      - key: BIND_HOST
        value: 0.0.0.0
      - key: EXPERIMENT_AUTH_ENABLED
        value: false

  - type: worker
    name: devworkspace-worker
    runtime: node
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pnpm install && pnpm build
    startCommand: node apps/worker/dist/main.js
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: devworkspace-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: SMTP_URL
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: PRODUCT_ENABLED
        value: true
      - key: EXPERIMENT_AUTH_ENABLED
        value: false

databases:
  - name: devworkspace-db
    plan: free
    databaseName: devworkspace
    user: devworkspace
