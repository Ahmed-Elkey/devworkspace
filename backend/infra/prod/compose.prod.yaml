name: devworkspace-prod
# Production stack: single Linux host, every service uses the host network and
# binds loopback ports only. Public traffic enters through Caddy (80/443, ACME)
# and is forwarded to the edge proxy on 127.0.0.1:8443 (PROXY_TLS=off).
#
# Runtime topology is byte-identical to the local development stack:
#   PostgreSQL 55432 · Redis 6379 · SeaweedFS 9333/19333/8080/18888/8888/9000/19000
#   API 3001 · proxy 8443 — nothing is reachable from outside except Caddy.
#
# Files referenced here are produced by the project bootstrap:
#   .env.prod                compose interpolation (admin/redis credentials, app origin)
#   ../../.local/prod-api.env, ../../.local/prod-worker.env   application secrets
#   ../../.local/prod/data/storage   restored SeaweedFS volume + filer metadata
#   ../../.local/prod/s3-identities.json   restored bucket-scoped S3 identities
x-node: &node
  image: node:22-bookworm
  init: true
  restart: unless-stopped
  network_mode: host
  working_dir: /workspace/backend
  volumes: ['../../..:/workspace:ro']
services:
  postgres:
    image: postgres:18.4-bookworm
    restart: unless-stopped
    network_mode: host
    command: ['postgres', '-c', 'port=55432', '-c', 'listen_addresses=127.0.0.1']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bootstrap}
      PGDATA: /var/lib/postgresql/data
    volumes: ['pg-data:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -p 55432 -U "$$POSTGRES_USER"']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.2.3-alpine
    restart: unless-stopped
    network_mode: host
    command:
      ['redis-server', '--bind', '127.0.0.1', '--protected-mode', 'no', '--save', '', '--appendonly', 'no', '--requirepass', '${REDIS_PASSWORD:?Run bootstrap}']
  storage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    network_mode: host
    command:
      [
        server,
        '-dir=/data',
        '-ip=127.0.0.1',
        '-ip.bind=127.0.0.1',
        '-master.port=9333',
        '-master.volumeSizeLimitMB=32',
        '-volume.max=16',
        '-volume.preStopSeconds=1',
        '-volume.port=8080',
        '-filer',
        '-filer.port=8888',
        '-s3',
        '-s3.port=9000',
        '-s3.port.iceberg=0',
        '-s3.port.lance=0',
        '-s3.config=/etc/seaweedfs/s3.json',
      ]
    volumes:
      - '../../.local/prod/data/storage:/data'
      - '../../.local/prod/s3-identities.json:/etc/seaweedfs/s3.json:ro'
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN:?Run bootstrap}
    volumes:
      - './Caddyfile:/etc/caddy/Caddyfile:ro'
      - 'caddy-data:/data'
      - 'caddy-config:/config'
  api:
    <<: *node
    command: [node, apps/api/dist/main.js]
    environment:
      NODE_ENV: production
    env_file: '../../.local/prod-api.env'
  worker:
    <<: *node
    command: [node, apps/worker/dist/main.js]
    environment:
      NODE_ENV: production
    env_file: '../../.local/prod-worker.env'
  proxy:
    <<: *node
    command: [node, scripts/proxy.mjs]
    environment:
      PROXY_TLS: 'off'
      PROXY_ORIGIN: ${APP_ORIGIN:?Run bootstrap}
      FRONT_STATIC_ROOT: /workspace/frontend/dist
      PROXY_BIND_HOST: '127.0.0.1'
volumes:
  pg-data: {}
  caddy-data: {}
  caddy-config: {}
